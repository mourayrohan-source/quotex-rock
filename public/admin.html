<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCK STAR • License Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070b;
      --card: #12121a;
      --card2: #1a1a24;
      --border: #2a2a3a;
      --purple: #8b5cf6;
      --purple2: #a78bfa;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139, 92, 246, 0.08), transparent);
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

    /* Login */
    #loginBox {
      max-width: 420px;
      margin: 12vh auto 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    #loginBox h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--purple2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    #loginBox .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    input, select {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 16px;
      transition: border 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--purple); }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35); }
    button.secondary { background: var(--card2); border: 1px solid var(--border); }
    button.danger { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    button.sm { width: auto; padding: 7px 14px; font-size: 0.8rem; }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .topbar h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .topbar h1 span { color: var(--purple2); }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.12);
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .badge-live::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }
    .stat .num {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--purple2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }

    /* Generated keys */
    .keys-box {
      display: none;
      margin-top: 16px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .keys-box.show { display: block; }
    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
    }
    .key-item:last-child { margin-bottom: 0; }
    .copy-btn {
      background: rgba(139, 92, 246, 0.15);
      color: var(--purple2);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: rgba(139, 92, 246, 0.3); }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: left;
      padding: 12px 10px;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.82rem; }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status.active { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status.unused { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .status.expired { background: rgba(234,179,8,0.15); color: #facc15; }
    .status.revoked { background: rgba(239,68,68,0.15); color: #f87171; }

    .msg {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.ok { display: block; background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .msg.err { display: block; background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    #mainApp { display: none; }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div id="loginBox">
      <h1>ROCK STAR</h1>
      <p class="sub">License Admin Panel</p>
      <label>Admin Password</label>
      <input type="password" id="adminPwd" placeholder="Enter admin password" autofocus>
      <button onclick="login()">Login to Dashboard</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- MAIN -->
    <div id="mainApp">
      <div class="topbar">
        <div>
          <h1>ROCK <span>STAR</span> License</h1>
          <div style="margin-top:6px"><span class="badge-live">Server Online</span></div>
        </div>
        <button class="secondary sm" onclick="logout()">Logout</button>
      </div>

      <div class="stats" id="stats"></div>

      <!-- GENERATE -->
      <div class="card">
        <h2>✨ Generate License Keys</h2>
        <div class="row">
          <div>
            <label>Duration</label>
            <select id="duration">
              <option value="10m">⏱ 10 Minutes</option>
              <option value="30m">⏱ 30 Minutes</option>
              <option value="1h">⏱ 1 Hour</option>
              <option value="1d" selected>📅 1 Day</option>
              <option value="1month">📅 1 Month</option>
              <option value="lifetime">♾️ Lifetime</option>
            </select>
          </div>
          <div>
            <label>How many keys?</label>
            <input type="number" id="count" value="1" min="1" max="50">
          </div>
          <div>
            <label>Customer Name / Note</label>
            <input type="text" id="name" placeholder="e.g. Rahul / Telegram">
          </div>
          <div>
            <label>Prefix</label>
            <input type="text" id="prefix" value="ROCK" maxlength="8">
          </div>
        </div>
        <button onclick="generateKeys()" style="margin-top:8px">Generate Keys</button>
        <div id="genMsg" class="msg"></div>
        <div id="generatedKeys" class="keys-box"></div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="margin:0">📋 All Licenses</h2>
          <button class="secondary sm" onclick="loadList()">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Key</th>
                <th>Name</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Device</th>
                <th>Expires</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </div>

      <p class="footer-note">ROCK STAR License System • One Key = One Device</p>
    </div>
  </div>

  <script>
    let adminPassword = localStorage.getItem('rs_admin_pwd') || '';

    function login() {
      adminPassword = document.getElementById('adminPwd').value;
      fetch('/api/admin/stats', { headers: { 'x-admin-password': adminPassword } })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            localStorage.setItem('rs_admin_pwd', adminPassword);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadStats();
            loadList();
          } else {
            showMsg('loginMsg', 'Wrong password', false);
          }
        })
        .catch(() => showMsg('loginMsg', 'Server offline or waking up... wait 30s & retry', false));
    }

    function logout() {
      localStorage.removeItem('rs_admin_pwd');
      location.reload();
    }

    // Auto login if password saved
    if (adminPassword) {
      document.getElementById('adminPwd').value = adminPassword;
      login();
    }

    function showMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    function loadStats() {
      fetch('/api/admin/stats', { headers: { 'x-admin-password': adminPassword } })
        .then(r => r.json())
        .then(d => {
          if (!d.success) return;
          const s = d.stats;
          document.getElementById('stats').innerHTML = `
            <div class="stat"><div class="num">${s.total}</div><div class="label">Total</div></div>
            <div class="stat"><div class="num">${s.unused}</div><div class="label">Unused</div></div>
            <div class="stat"><div class="num">${s.active}</div><div class="label">Active</div></div>
            <div class="stat"><div class="num">${s.expired}</div><div class="label">Expired</div></div>
            <div class="stat"><div class="num">${s.revoked}</div><div class="label">Revoked</div></div>
          `;
        });
    }

    function generateKeys() {
      const body = {
        duration: document.getElementById('duration').value,
        count: parseInt(document.getElementById('count').value) || 1,
        name: document.getElementById('name').value,
        prefix: document.getElementById('prefix').value || 'ROCK'
      };
      fetch('/api/admin/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify(body)
      })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          showMsg('genMsg', `✅ ${d.message}`, true);
          const box = document.getElementById('generatedKeys');
          box.className = 'keys-box show';
          box.innerHTML = d.keys.map(k => `
            <div class="key-item">
              <span>${k}</span>
              <button class="copy-btn" onclick="copyKey('${k}', this)">Copy</button>
            </div>
          `).join('');
          loadStats();
          loadList();
        } else {
          showMsg('genMsg', d.message || 'Error', false);
        }
      })
      .catch(() => showMsg('genMsg', 'Server error / waking up', false));
    }

    function copyKey(key, btn) {
      navigator.clipboard.writeText(key).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    function loadList() {
      fetch('/api/admin/list', { headers: { 'x-admin-password': adminPassword } })
        .then(r => r.json())
        .then(d => {
          if (!d.success) return;
          const tbody = document.getElementById('listBody');
          if (d.licenses.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No licenses yet. Generate some above.</td></tr>';
            return;
          }
          tbody.innerHTML = d.licenses.map(l => {
            const exp = l.expiresAt ? new Date(l.expiresAt).toLocaleString() : 'Never';
            return `<tr>
              <td class="mono">${l.key}</td>
              <td>${l.name || '—'}</td>
              <td>${l.duration}</td>
              <td><span class="status ${l.status}">${l.status}</span></td>
              <td>${l.hasDevice ? '🔒 Bound' : '🔓 Free'}</td>
              <td style="font-size:0.8rem;color:var(--muted)">${exp}</td>
              <td class="actions">
                <button class="secondary sm" onclick="unbind('${l.key}')">Unbind</button>
                <button class="danger sm" onclick="revoke('${l.key}')">Revoke</button>
              </td>
            </tr>`;
          }).join('');
        });
    }

    function revoke(key) {
      if (!confirm('Revoke ' + key + ' ?')) return;
      fetch('/api/admin/revoke', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify({ key })
      }).then(r => r.json()).then(d => { alert(d.message); loadStats(); loadList(); });
    }

    function unbind(key) {
      if (!confirm('Unbind device from ' + key + '?')) return;
      fetch('/api/admin/unbind', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify({ key })
      }).then(r => r.json()).then(d => { alert(d.message); loadStats(); loadList(); });
    }

    document.getElementById('adminPwd').addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
